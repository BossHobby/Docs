name: ci
on:
  push:
    branches-ignore: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test script/pages.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s script -p 'test_*.py'
      - name: Set branch URL and edit links
        run: node script/pages.mjs base >> "$GITHUB_ENV"
      - run: mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: gh-pages
          path: site
          retention-days: 7
